# Decap CMS — staff may edit only the sections listed below.
# Repo: tphal001/highschool — open https://YOUR-DOMAIN/admin/

backend:
  name: github
  repo: tphal001/highschool
  branch: main
  base_url: https://highschool-gold.vercel.app

media_folder: media/uploads
public_folder: /media/uploads

collections:
  - name: staff_content
    label: School content (staff)
    files:
      - label: Management
        name: management
        file: content/cms/management.json
        fields:
          - label: Mission
            name: mission
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
          - label: Vision
            name: vision
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }

      - label: Board and Governing Body Members
        name: board
        file: content/cms/board.json
        fields:
          - { label: Intro, name: intro, widget: text }
          - label: Members
            name: members
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role / designation, name: role, widget: string }
              - { label: Photo URL (optional), name: photo, widget: string, required: false }

      - label: Principal Desk
        name: principal
        file: content/cms/principal.json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Photo URL, name: photo, widget: string }
          - label: Message paragraphs
            name: message
            widget: list
            field: { label: Paragraph, name: p, widget: text }

      - label: Staff
        name: staff
        file: content/cms/staff.json
        fields:
          - { label: Intro, name: intro, widget: text }
          - label: Staff members
            name: members
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Department / subject (optional), name: department, widget: string, required: false }

      - label: Admissions
        name: admissions
        file: content/cms/admissions.json
        fields:
          - { label: Intro, name: intro, widget: text }
          - label: Process steps
            name: process
            widget: list
            field: { label: Step, name: step, widget: string }
          - label: Requirements
            name: requirements
            widget: list
            field: { label: Item, name: item, widget: string }

      - label: Events
        name: events
        file: content/cms/events.json
        fields:
          - label: Event items
            name: events
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Date (YYYY-MM-DD), name: date, widget: string }
              - { label: Display date, name: displayDate, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
              - {
                  label: Anchor ID (for menu links, e.g. evt-silver),
                  name: anchorId,
                  widget: string,
                  required: false,
                }

      - label: Results
        name: results
        file: content/cms/results.json
        fields:
          - label: Result items
            name: items
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
              - {
                  label: Anchor ID (for menu links, e.g. res-ssc),
                  name: anchorId,
                  widget: string,
                  required: false,
                }
              - { label: Display date (optional), name: displayDate, widget: string, required: false }

      - label: Activity
        name: activity
        file: content/cms/activity.json
        fields:
          - { label: Intro, name: intro, widget: text }
          - label: Activity items
            name: items
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Image URL, name: image, widget: string }
              - { label: Caption (optional), name: caption, widget: text, required: false }

      - label: Gallery
        name: gallery
        file: content/cms/gallery.json
        fields:
          - { label: Intro, name: intro, widget: string }
          - label: Photo items
            name: items
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Category, name: category, widget: string }
              - { label: Image URL, name: image, widget: string }
          - { label: Video gallery note, name: videoNote, widget: text, required: false }
