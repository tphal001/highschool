# Decap CMS — staff may edit only the sections listed below.
# Repo: tphal001/highschool — open https://YOUR-DOMAIN/admin/

backend:
  name: github
  repo: tphal001/highschool
  branch: main
  base_url: https://highschool-gold.vercel.app

media_folder: images
public_folder: /images

collections:
  - name: staff_content
    label: School content (staff)
    files:
      - label: Board and Governing Body Members
        name: board
        file: content/cms/board.json
        fields:
          - { label: Intro, name: intro, widget: text }
          - label: Members
            name: members
            widget: list
            summary: "{{fields.name}}"
            hint: "Members appear on the site in the same order as listed here (new entries at the end)."
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role / designation, name: role, widget: string }
              - { label: Photo (optional), name: photo, widget: image, choose_url: false, required: false }

      - label: Principal Desk
        name: principal
        file: content/cms/principal.json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Photo, name: photo, widget: image, choose_url: false }
          - label: Message paragraphs
            name: message
            widget: list
            field: { label: Paragraph, name: p, widget: text }

      - label: Staff
        name: staff
        file: content/cms/staff.json
        fields:
          - { label: Intro, name: intro, widget: text }
          - label: Staff members
            name: members
            widget: list
            summary: "{{fields.name}}"
            hint: "Staff appear on the site in the same order as listed here (new entries at the end)."
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Department / subject (optional), name: department, widget: string, required: false }
              - { label: Photo (optional), name: photo, widget: image, choose_url: false, required: false }

      - label: Admissions
        name: admissions
        file: content/cms/admissions.json
        fields:
          - { label: Intro, name: intro, widget: text }
          - {
              label: Current admission session (optional),
              name: sessionLabel,
              widget: string,
              required: false,
              hint: "e.g. 2026–27 — shown on the admissions page, not in the menu.",
            }
          - label: Process steps
            name: process
            widget: list
            field: { label: Step, name: step, widget: string }
          - label: Requirements
            name: requirements
            widget: list
            field: { label: Item, name: item, widget: string }

      - label: Events
        name: events
        file: content/cms/events.json
        fields:
          - label: Event items
            name: events
            widget: list
            summary: "{{fields.title}}"
            hint: "Newest events appear first on the site after you publish."
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
              - { label: Photo (optional), name: image, widget: image, choose_url: false, required: false }
              - {
                  label: Show in main menu,
                  name: showInNav,
                  widget: boolean,
                  default: true,
                  hint: "Uncheck when this event should drop off the Events submenu.",
                }
              - {
                  label: Anchor ID (optional — auto-generated from title if empty),
                  name: anchorId,
                  widget: string,
                  required: false,
                }

      - label: Results
        name: results
        file: content/cms/results.json
        fields:
          - label: Result items
            name: items
            widget: list
            summary: "{{fields.title}}"
            hint: "Newest items appear first on the site after you publish."
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }
              - { label: Photo (optional), name: image, widget: image, choose_url: false, required: false }
              - {
                  label: Anchor ID (optional — auto-generated from title if empty),
                  name: anchorId,
                  widget: string,
                  required: false,
                }
              - {
                  label: Show in main menu,
                  name: showInNav,
                  widget: boolean,
                  default: true,
                  hint: "Uncheck when this result should drop off the Results submenu.",
                }

      - label: Recognitions
        name: recognitions
        file: content/cms/recognitions.json
        fields:
          - {
              label: Intro (optional),
              name: intro,
              widget: text,
              required: false,
              hint: "Short line shown at the top of the Recognitions section.",
            }
          - label: Recognised candidates
            name: items
            widget: list
            summary: "{{fields.name}}"
            hint: "Newest recognitions appear first after you publish."
            fields:
              - { label: Candidate name, name: name, widget: string }
              - { label: Summary, name: summary, widget: text }
              - { label: Photo (optional), name: image, widget: image, choose_url: false, required: false }

      - label: Notices
        name: notices
        file: content/cms/notices.json
        fields:
          - label: Notice items
            name: items
            widget: list
            summary: "{{fields.title}}"
            hint: "Newest notices appear first after you publish."
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Summary, name: summary, widget: text }

      - label: Alumni spotlight (home page)
        name: alumniSpotlight
        file: content/cms/alumniSpotlight.json
        fields:
          - { label: Section title, name: sectionTitle, widget: string, default: "Alumni spotlight" }
          - { label: Section subtitle, name: sectionSubtitle, widget: text }
          - label: Alumni stories
            name: stories
            widget: list
            summary: "{{fields.name}}"
            hint: "Add one entry per alumnus. New entries appear at the end on the home page."
            fields:
              - { label: Quote, name: quote, widget: text }
              - { label: Name, name: name, widget: string }
              - { label: Role / class line, name: role, widget: string }
              - { label: Initials (optional), name: initials, widget: string, required: false }
              - { label: Photo (optional), name: photo, widget: image, choose_url: false, required: false }
          - label: Stats (optional)
            name: stats
            widget: list
            summary: "{{fields.label}}"
            required: false
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Value, name: value, widget: string }
          - { label: Link label, name: linkLabel, widget: string, default: "Explore alumni & register" }
          - { label: Link URL, name: linkHref, widget: string, default: "alumni.html" }

      - label: Activity
        name: activity
        file: content/cms/activity.json
        fields:
          - { label: Intro, name: intro, widget: text }
          - label: Activity items
            name: items
            widget: list
            summary: "{{fields.title}}"
            hint: "Newest activities appear first after you publish."
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Photo, name: image, widget: image, choose_url: false }
              - { label: Caption (optional), name: caption, widget: text, required: false }

      - label: Gallery
        name: gallery
        file: content/cms/gallery.json
        fields:
          - {
              label: Page intro,
              name: intro,
              widget: text,
              required: false,
              hint: "Shown at the top of the gallery page on the website.",
            }
          - label: Image albums
            name: photoBatches
            widget: list
            summary: "{{fields.title}}"
            label_singular: album
            add_to_top: true
            collapsed: true
            hint: "Managed by Upload Images above. Expand only to edit or remove albums."
            fields:
              - { label: Title, name: title, widget: string }
              - label: Photos
                name: images
                widget: list
                label_singular: photo
                field:
                  label: Photo file
                  name: image
                  widget: image
                  choose_url: false
          - label: Video albums
            name: videoBatches
            widget: list
            summary: "{{fields.title}}"
            label_singular: album
            add_to_top: true
            collapsed: true
            hint: "Managed by Upload Videos above. Expand only to edit or remove albums."
            fields:
              - { label: Title, name: title, widget: string }
              - label: Videos
                name: videos
                widget: list
                label_singular: video
                field:
                  label: Video file
                  name: video
                  widget: file
                  choose_url: false

      - label: Highlights (posters & popup)
        name: highlight
        file: content/cms/highlight.json
        fields:
          - {
              label: Popup when site opens,
              name: showModalOnOpen,
              widget: boolean,
              default: true,
              hint: "Shows the highlight popup on first visit each session (cycles through items below).",
            }
          - {
              label: Once per browser session,
              name: oncePerSession,
              widget: boolean,
              default: true,
            }
          - {
              label: Cache bust (change when any poster changes),
              name: cacheBust,
              widget: string,
              required: false,
              hint: "e.g. v2 — re-shows the opening popup after you publish new highlights.",
            }
          - label: Highlight items
            name: items
            widget: list
            summary: "{{fields.headline}}"
            hint: "Newest highlights appear first after you publish."
            fields:
              - {
                  label: Active,
                  name: enabled,
                  widget: boolean,
                  default: true,
                }
              - {
                  label: Show on home page,
                  name: showOnHome,
                  widget: boolean,
                  default: true,
                }
              - { label: Badge (optional), name: badge, widget: string, required: false, default: "Highlights" }
              - { label: Headline, name: headline, widget: string }
              - { label: Student / achiever name, name: studentName, widget: string, required: false }
              - { label: Accomplishment text, name: accomplishment, widget: text }
              - { label: Poster photo, name: posterImage, widget: image, choose_url: false }
              - {
                  label: View button label,
                  name: linkLabel,
                  widget: string,
                  default: "View",
                  required: false,
                  hint: "Opens the full-size highlight poster popup.",
                }
              - {
                  label: Link URL (optional),
                  name: linkUrl,
                  widget: string,
                  required: false,
                  hint: "Paste a form link, Google Form, payment page, or any URL. Opens in a new tab when external.",
                }
              - {
                  label: Link button label,
                  name: linkUrlLabel,
                  widget: string,
                  default: "Open link",
                  required: false,
                }
              - {
                  label: Item cache bust,
                  name: cacheBust,
                  widget: string,
                  required: false,
                }

      - label: Quick Announcements
        name: quickAnnouncements
        file: content/cms/quickAnnouncements.json
        fields:
          - label: Announcement cards (home page)
            name: items
            widget: list
            summary: "{{fields.title}}"
            hint: "Newest announcements appear first after you publish."
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Short summary (home card), name: excerpt, widget: text }
              - {
                  label: Full announcement (optional),
                  name: body,
                  widget: text,
                  required: false,
                  hint: "Shown when visitors click Read more. Leave blank to use the short summary only.",
                }
              - { label: Poster / image (optional), name: image, widget: image, choose_url: false, required: false }
              - {
                  label: Optional link,
                  name: href,
                  widget: string,
                  required: false,
                  hint: "Google Form, payment page, or other URL — shown as a button inside the announcement popup. Leave blank or use the default for no extra link.",
                  default: "news.html?ctx=events",
                }

      - label: Latest Updates (home ticker)
        name: latestUpdates
        file: content/cms/latestUpdates.json
        fields:
          - label: Update lines (scroll on home hero)
            name: items
            widget: list
            hint: "Newest lines appear first in the home ticker."
            field: { label: Update line, name: text, widget: string }
